openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Media Tracker API - TMDB powered movie and TV tracking
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Search and discover media
  - name: media
    description: Media details
  - name: watchlist
    description: User watchlist management
  - name: stats
    description: User statistics and summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /search:
    get:
      operationId: searchMedia
      tags: [search]
      summary: Search movies and TV shows
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, tv]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /search/people:
    get:
      operationId: searchPeople
      tags: [search]
      summary: Search actors and other people
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: People search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSearchResult"

  /search/by-tag:
    get:
      operationId: searchByTag
      tags: [search]
      summary: Search movies and TV by theme tags (keywords)
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, tv]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Titles matching theme tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSearchResult"

  /people/{personId}:
    get:
      operationId: getPersonDetails
      tags: [search]
      summary: Get person profile
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetails"

  /people/{personId}/credits:
    get:
      operationId: getPersonCredits
      tags: [search]
      summary: Get movies and TV shows a person appeared in
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, tv]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: Person acting credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonCreditsResult"

  /discover:
    get:
      operationId: discoverMedia
      tags: [search]
      summary: Discover trending and popular media
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, tv]
            default: movie
        - name: genre
          in: query
          schema:
            type: ["integer", "null"]
        - name: sort_by
          in: query
          schema:
            type: string
            enum:
              [
                popularity.desc,
                vote_average.desc,
                vote_count.desc,
                release_date.desc,
                release_date.asc,
                revenue.desc,
                title.asc,
              ]
            default: popularity.desc
        - name: min_rating
          in: query
          schema:
            type: ["number", "null"]
        - name: min_year
          in: query
          schema:
            type: ["integer", "null"]
        - name: max_year
          in: query
          schema:
            type: ["integer", "null"]
        - name: language
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /trending:
    get:
      operationId: getTrending
      tags: [search]
      summary: Get trending movies and TV shows
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, movie, tv]
            default: all
        - name: time_window
          in: query
          schema:
            type: string
            enum: [day, week]
            default: week
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Trending media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /browse:
    get:
      operationId: getBrowseCategory
      tags: [search]
      summary: Browse media by category
      parameters:
        - name: category
          in: query
          required: true
          schema:
            type: string
            enum: [popular_movies, popular_tv, top_rated_movies, top_rated_tv, now_playing, upcoming, on_air]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Browse results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /recommendations/watchlist:
    get:
      operationId: getWatchlistRecommendations
      tags: [search]
      summary: Random recommendations based on the user's watchlist
      description: Picks random watchlist titles and returns similar TMDB titles, reshuffled on each request.
      parameters:
        - name: exclude_tracked
          in: query
          description: Omit items already on the watchlist (any status)
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Watchlist-based recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /genres:
    get:
      operationId: getGenres
      tags: [search]
      summary: Get all genres for movies and TV
      responses:
        "200":
          description: Genre list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreList"

  /media/{mediaType}/{tmdbId}:
    get:
      operationId: getMediaDetails
      tags: [media]
      summary: Get full details for a movie or TV show
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full media details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetails"
        "404":
          description: Not found

  /media/{mediaType}/{tmdbId}/credits:
    get:
      operationId: getMediaCredits
      tags: [media]
      summary: Get cast and crew
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cast and crew credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credits"

  /media/{mediaType}/{tmdbId}/metadata:
    get:
      operationId: getMediaMetadata
      tags: [media]
      summary: Get tags, writers, and alternative titles
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Extra metadata for a title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaMetadata"

  /media/{mediaType}/{tmdbId}/videos:
    get:
      operationId: getMediaVideos
      tags: [media]
      summary: Get trailers and videos
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoList"

  /media/{mediaType}/{tmdbId}/similar:
    get:
      operationId: getSimilarMedia
      tags: [media]
      summary: Get similar movies or shows
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Similar media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaSearchResult"

  /media/{mediaType}/{tmdbId}/watch-providers:
    get:
      operationId: getWatchProviders
      tags: [media]
      summary: Get streaming, rental and purchase availability
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Watch provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProvidersResult"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get user watchlist
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [watching, watched, want_to_watch, unsure, waiting]
          style: form
          explode: true
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [movie, tv]
          style: form
          explode: true
        - name: genre
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: min_rating
          in: query
          schema:
            type: array
            items:
              type: number
          style: form
          explode: true
        - name: year_range
          in: query
          description: Year range as min-max (e.g. 2020-2029, 2023, -1979 for max only)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: language
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [added_at, title, rating, release_date]
            default: added_at
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add item to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistInput"
      responses:
        "201":
          description: Added to watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"

  /watchlist/{id}:
    patch:
      operationId: updateWatchlistItem
      tags: [watchlist]
      summary: Update watch status or rating
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistUpdate"
      responses:
        "200":
          description: Updated watchlist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistItem"
        "404":
          description: Not found
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove item from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /watchlist/status/{mediaType}/{tmdbId}:
    get:
      operationId: getWatchStatus
      tags: [watchlist]
      summary: Get watch status for a specific item
      parameters:
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Watch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchStatusResult"

  /lists:
    get:
      operationId: getCustomLists
      tags: [lists]
      summary: Get all custom lists
      responses:
        "200":
          description: Custom lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomListSummary"
    post:
      operationId: createCustomList
      tags: [lists]
      summary: Create a custom list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomListInput"
      responses:
        "201":
          description: Created list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomListDetail"

  /lists/{id}:
    get:
      operationId: getCustomList
      tags: [lists]
      summary: Get custom list with items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomListDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCustomList
      tags: [lists]
      summary: Update custom list metadata or rules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomListUpdate"
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomListDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteCustomList
      tags: [lists]
      summary: Delete a custom list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /lists/{id}/items:
    post:
      operationId: addCustomListItem
      tags: [lists]
      summary: Add watchlist item to a manual list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomListItemInput"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomListDetail"
        "404":
          description: Not found

  /lists/{id}/items/{listItemId}:
    delete:
      operationId: removeCustomListItem
      tags: [lists]
      summary: Remove item from manual or snapshot list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: listItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found

  /lists/{id}/refresh:
    post:
      operationId: refreshCustomList
      tags: [lists]
      summary: Re-evaluate rules and update snapshot list membership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refreshed list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomListDetail"
        "404":
          description: Not found

  /media/tv/{tmdbId}/seasons/{seasonNumber}:
    get:
      operationId: getSeasonDetails
      tags: [media]
      summary: Get season details with episode list
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Season details with episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetails"

  /progress/tv/{tmdbId}:
    get:
      operationId: getTvProgress
      tags: [watchlist]
      summary: Get episode watch progress for a TV show
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Episode progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TvProgress"

  /progress/tv/{tmdbId}/season/{seasonNumber}:
    get:
      operationId: getSeasonProgress
      tags: [watchlist]
      summary: Get season details with watched state per episode
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Season with per-episode watched state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonWithProgress"

  /progress/tv/{tmdbId}/episode:
    post:
      operationId: markEpisodeWatched
      tags: [watchlist]
      summary: Mark a single episode watched or unwatched
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeWatchInput"
      responses:
        "200":
          description: Updated episode state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeWatchResult"

  /progress/tv/{tmdbId}/season/{seasonNumber}/watch:
    post:
      operationId: markSeasonWatched
      tags: [watchlist]
      summary: Mark all episodes in a season watched or unwatched
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonNumber
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAllInput"
      responses:
        "200":
          description: Season mark result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonWatchResult"

  /progress/tv/{tmdbId}/watch-all:
    post:
      operationId: markSeriesWatched
      tags: [watchlist]
      summary: Mark all episodes across all seasons watched or unwatched
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchAllInput"
      responses:
        "200":
          description: Series mark result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesWatchResult"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get user stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/genres:
    get:
      operationId: getGenreStats
      tags: [stats]
      summary: Get watch counts by genre
      responses:
        "200":
          description: Genre breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenreStat"

  /stats/recently-watched:
    get:
      operationId: getRecentlyWatched
      tags: [stats]
      summary: Get recently watched items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recently watched
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MediaItem:
      type: object
      properties:
        tmdbId:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
        originalTitle:
          type: ["string", "null"]
        overview:
          type: ["string", "null"]
        posterPath:
          type: ["string", "null"]
        backdropPath:
          type: ["string", "null"]
        releaseDate:
          type: ["string", "null"]
        voteAverage:
          type: ["number", "null"]
        voteCount:
          type: ["integer", "null"]
        popularity:
          type: ["number", "null"]
        genreIds:
          type: array
          items:
            type: integer
        adult:
          type: ["boolean", "null"]
        originalLanguage:
          type: ["string", "null"]
      required:
        - tmdbId
        - mediaType
        - title

    MediaSearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        totalResults:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
      required:
        - results
        - totalResults
        - totalPages
        - page

    PersonSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        profilePath:
          type: ["string", "null"]
        knownForDepartment:
          type: ["string", "null"]
        knownFor:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
      required:
        - id
        - name
        - knownFor

    PersonSearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PersonSummary"
        totalResults:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
      required:
        - results
        - totalResults
        - totalPages
        - page

    PersonDetails:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        profilePath:
          type: ["string", "null"]
        biography:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
        placeOfBirth:
          type: ["string", "null"]
        knownForDepartment:
          type: ["string", "null"]
      required:
        - id
        - name

    PersonCredit:
      type: object
      properties:
        tmdbId:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
        originalTitle:
          type: ["string", "null"]
