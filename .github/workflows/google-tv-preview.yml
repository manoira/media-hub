name: Build MediaHub Google TV preview

on:
  workflow_dispatch:
  push:
    branches: [v2-local-foundation]
    paths:
      - 'deploy/google-tv/**'
      - '.github/workflows/google-tv-preview.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: bash deploy/google-tv/build-preview.sh "$RUNNER_TEMP/MediaHub-TV-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MediaHub-TV-preview
          path: ${{ runner.temp }}/MediaHub-TV-preview.apk
          if-no-files-found: error
