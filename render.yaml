services:
  - type: web
    name: media-hub
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server... run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
